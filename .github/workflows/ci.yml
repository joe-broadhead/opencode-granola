# Runs exactly what a contributor runs locally: npm ci with scripts off, then npm run check.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  # A run by hand on any branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is part of the group, so a run by hand on master never cancels the push run a release stands on.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_PUBLIC || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint parses the workflows as workflows, not as YAML: a `${{ }}` in a context that does not exist makes
      # GitHub reject the file and run nothing at all.
      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -sSfLO "${base}/actionlint_${version}_linux_amd64.tar.gz"
          curl -sSfLO "${base}/actionlint_${version}_checksums.txt"
          grep " actionlint_${version}_linux_amd64.tar.gz$" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${version}_linux_amd64.tar.gz" actionlint
          ./actionlint -color
          echo "$PWD" >> "$GITHUB_PATH" # so `npm run check`'s actionlint stage finds it too
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Caches ~/.npm. The host and pack tests install the stock @opencode/cli release named in src/hosts.ts
          # (TESTED_HOSTS: 2.4.1) through npm, so that file is part of the key.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/hosts.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # the Bun the host and pack stages run under
      # OpenCode installs plugins with scripts off, and no dev dependency needs its install script.
      - run: npm ci --ignore-scripts
      - run: npm run check
