# Runs exactly what a contributor runs locally: npm ci with scripts off, then npm run check.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Public GitHub-hosted runners: Linux x64, Linux arm64, macOS arm64, macOS x64.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Caches ~/.npm per OS and architecture. The pack test installs the stock @opencode/cli releases
          # it names through npm, so that file is part of the key.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/pack-smoke.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # the Bun inside stock OpenCode 2.2.3 and 2.2.4
      # OpenCode installs plugins with scripts off, and no dev dependency needs its install script.
      - run: npm ci --ignore-scripts
      - run: npm run check
